<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LibrasPlay - Jogo da Memória</title>
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body data-page="memoria" data-base-path="../">
  <div id="cabecalho"></div>

  <main class="container conteudo-principal">
    <section class="pagina-titulo">
      <p class="etiqueta">Jogo educativo</p>
      <h1>Jogo da Memória</h1>
      <p>Encontre os pares: imagem do sinal e letra correspondente.</p>
      <div class="acoes-modulo" aria-label="Ações da memória">
        <button class="botao botao-reiniciar" id="btnReiniciarMemoriaTopo" type="button">Reiniciar</button>
        <a class="botao menu-principal-botao" href="../index.html">Voltar ao menu</a>
      </div>
    </section>

    <section class="cartao">
      <div class="topo-modulo">
        <div class="controle-jogo">
          <label for="seletorCartas">Tamanho do jogo:</label>
          <select id="seletorCartas" aria-label="Tamanho do jogo">
            <!-- total de cartas: 6 (3 pares), 8 (4 pares) ... até 52 (26 pares) -->
            <option value="6">6 cartas (3 pares)</option>
            <option value="8">8 cartas (4 pares)</option>
            <option value="10">10 cartas (5 pares)</option>
            <option value="12">12 cartas (6 pares)</option>
            <option value="14">14 cartas (7 pares)</option>
            <option value="16">16 cartas (8 pares)</option>
            <option value="18">18 cartas (9 pares)</option>
            <option value="20">20 cartas (10 pares)</option>
            <option value="22">22 cartas (11 pares)</option>
            <option value="24">24 cartas (12 pares)</option>
            <option value="26">26 cartas (13 pares)</option>
            <option value="28">28 cartas (14 pares)</option>
            <option value="30">30 cartas (15 pares)</option>
            <option value="32">32 cartas (16 pares)</option>
            <option value="34">34 cartas (17 pares)</option>
            <option value="36">36 cartas (18 pares)</option>
            <option value="38">38 cartas (19 pares)</option>
            <option value="40">40 cartas (20 pares)</option>
            <option value="42">42 cartas (21 pares)</option>
            <option value="44">44 cartas (22 pares)</option>
            <option value="46">46 cartas (23 pares)</option>
            <option value="48">48 cartas (24 pares)</option>
            <option value="50">50 cartas (25 pares)</option>
            <option value="52">52 cartas (26 pares)</option>
          </select>
        </div>
        <span id="pontosMemoria">Pontos: 0</span>
        <span id="tentativasMemoria">Tentativas: 0</span>
        <span id="tempoMemoria">Tempo: 00:00</span>
      </div>

      <div id="tabuleiroMemoria" class="tabuleiro-memoria" aria-label="Cartas do jogo da memória"></div>

      <div id="feedbackMemoria" class="feedback" aria-live="polite"></div>

    </section>

    <section class="cartao resultado oculto" id="resultadoMemoria" aria-live="polite"></section>
  </main>

  <script src="../js/app.js"></script>
  <script src="../js/memoria.js"></script>
</body>
</html>
